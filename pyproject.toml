[project]
name = "lingo-rag"
version = "0.1.0"
description = "Multilingual RAG language-learning assistant (English / Chinese / Thai)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
